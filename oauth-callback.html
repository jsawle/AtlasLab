<!DOCTYPE html>
<!-- ArcGIS sign-in pop-up callback, from Esri's jsapi-resources (oauth/oauth-callback.html, Apache-2.0). Its script is in
     oauth-callback.js so that this page's Content Security Policy can forbid everything else: the page receives the
     sign-in result in its address, so nothing but that one script may run or load here.
     Register this page's full URL as a redirect URI on the app's client ID. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <title>Signing in</title>
    <script src="./oauth-callback.js"></script>
  </head>
  <body></body>
</html>
